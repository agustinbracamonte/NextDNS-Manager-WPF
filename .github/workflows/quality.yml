name: Pruebas aisladas de Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Preparar CLI oficial con hash verificado
        shell: pwsh
        run: ./scripts/Prepare-NextDNSCli.ps1
      - name: Comprobar catálogos de idiomas
        shell: pwsh
        run: |
          python ./scripts/check-localization.py
          if ($LASTEXITCODE -ne 0) { throw 'Falló la comprobación de idiomas.' }
      - name: Comprobar fallos, recuperación y políticas del servicio
        shell: pwsh
        run: |
          dotnet run --project tests/BrokerProbe/BrokerProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas aisladas del servicio.' }
      - name: Comprobar diagnóstico de activación sin modificar DNS
        shell: pwsh
        run: |
          dotnet run --project tests/ActivationPreflightProbe/ActivationPreflightProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas del diagnóstico de activación.' }
      - name: Comprobar API con transporte simulado
        shell: pwsh
        run: |
          dotnet run --project tests/NextDnsApiProbe/NextDnsApiProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas simuladas de API.' }
      - name: Comprobar actualización, integridad y cancelación
        shell: pwsh
        run: |
          dotnet run --project tests/UpdateProbe/UpdateProbe.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Fallaron las pruebas del actualizador.' }
